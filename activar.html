<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Shadow Fest · Activa tu entrada</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="portal.css"></head><body><header class="portal-header"><a class="brand" href="index.html">SHADOW<span>FEST</span></a><a href="index.html">Ver el evento ↗</a></header><div class="demo-banner" id="demo-notice"></div><main class="panel claim-shell"><p class="eyebrow">31 OCT / LIMA / +18</p><h1>Ya estás<br><em>en la lista.</em></h1><p>Activa tu entrada con el código que te brindó tu vendedor.</p><form id="code-form"><label>Ingrese código brindado<input name="code" id="claim-code" required maxlength="32" autocomplete="off" spellcheck="false"></label><button class="button" type="submit">CONTINUAR ↗</button></form><form id="registration-form" class="hidden"><p class="eyebrow" id="selected-pass"></p><label>Nombre y apellidos<input name="name" required minlength="3" maxlength="80" autocomplete="name"></label><label>Celular de contacto<input name="phone" type="tel" required maxlength="20" autocomplete="tel" placeholder="+51 955 000 000"></label><label class="check-line"><input type="checkbox" name="adult" required>Soy mayor de 18 años y presentaré mi documento al ingresar.</label><label class="check-line"><input type="checkbox" name="consent" required>Autorizo usar mi nombre y celular para registrar esta entrada y coordinar mi asistencia con la organización.</label><p class="form-note">Tu entrada quedará a tu nombre. Verifica tus datos antes de confirmar; para corregirlos contacta al organizador. No compartas el enlace ni el código.</p><button class="button" type="submit">REGISTRARME Y VER MI QR ↗</button></form><p id="claim-status" role="status"></p><a id="open-pass" class="button hidden">ABRIR MI QR ↗</a></main><script type="module" src="activar.js"></script></body></html>
