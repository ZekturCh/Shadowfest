<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShadowFest — Validar QR</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="portal.css"></head><body><header><a class="brand" href="index.html">SHADOW<span>FEST</span></a><a class="text-link" href="admin.html">Administración ↗</a></header><div class="demo-banner" id="demo-notice"></div><section class="panel access-gate" id="access-gate"><p class="eyebrow">ACCESO EN PUERTA</p><h1>Control de<br><em>ingreso.</em></h1><form id="access-form"><label>Código de acceso<input name="code" type="password" required maxlength="64" autocomplete="off"></label><button class="button" type="submit">DESBLOQUEAR ↗</button></form><p id="access-status" role="status"></p></section><main id="staff-content" class="workspace hidden" style="max-width:780px"><nav class="system-nav" aria-label="Sistema de entradas"><a href="admin.html">Administrar entradas ↗</a><a href="validar.html" aria-current="page">Validar en puerta</a></nav><p class="eyebrow" id="actor-name">STAFF / CONTROL DE ACCESO</p><button class="secondary" id="logout">Salir</button><h1 style="font-size:64px">Valida.<br><em>Deja entrar.</em></h1><p>Consulta el QR primero. Confirma el ingreso solo cuando el asistente esté en puerta.</p><section class="panel stack"><form id="lookup-form"><label>Código o enlace de la entrada<input name="code" id="code-input" required placeholder="Pega el enlace o el código completo" autocomplete="off"></label><button class="button" type="submit">CONSULTAR ENTRADA</button></form><button class="secondary" id="start-camera">Escanear con cámara</button><button class="secondary hidden" id="stop-camera">Detener cámara</button><video id="scanner-video" class="scanner hidden" autoplay playsinline muted></video><p id="scan-status" role="status">También puedes pegar un enlace sin usar la cámara.</p><div id="scan-result" class="hidden"><h3 id="scan-name"></h3><p id="scan-package"></p><p id="validation-status" class="status" role="status"></p><button id="confirm-entry" class="button" disabled>CONFIRMAR INGRESO</button></div></section></main><script type="module" src="validar.js"></script></body></html>
